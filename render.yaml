# ==============================================================================
# BugBunny — Render Blueprint Specification (render.yaml)
# Deploy FastAPI backend directly to Render with zero local Docker overhead
# ==============================================================================

services:
  - type: web
    name: bugbunny-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt

    startCommand: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT": uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false # Paste your Neon, Supabase, or Render PostgreSQL URL
      - key: SYNC_DATABASE_URL
        sync: false # Optional: Automatically derived from DATABASE_URL if omitted
      - key: CORS_ORIGINS
        value: "https://bugbunny-ten.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: AGENT_MODE
        value: live
      - key: AGENT_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GITHUB_TOKEN
        sync: false
