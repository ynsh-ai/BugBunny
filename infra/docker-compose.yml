services:
  postgres:
    image: postgres:16-alpine
    container_name: patchpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patchpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patchpilot_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-patchpilot_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patchpilot} -d ${POSTGRES_DB:-patchpilot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
